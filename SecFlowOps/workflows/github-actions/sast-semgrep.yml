name: SecFlowOps Semgrep SAST

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.169.0

      - name: Run Semgrep
        run: |
          mkdir -p secflowops-ci-artifacts/scanner_outputs
          semgrep scan --metrics=off --disable-version-check \
            --config SecFlowOps/scanners/semgrep/secflowops.yml \
            --json --output secflowops-ci-artifacts/scanner_outputs/semgrep.json SecFlowOps/repos/sample_api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-json
          path: secflowops-ci-artifacts/
