name: SecFlowOps SCA OSV

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            --format json
            --output secflowops-osv.json
            SecFlowOps/repos/sample_api

      - name: Upload OSV output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-output
          path: secflowops-osv.json
