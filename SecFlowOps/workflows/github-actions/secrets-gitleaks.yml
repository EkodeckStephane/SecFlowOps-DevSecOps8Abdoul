name: SecFlowOps Gitleaks secrets

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-output
          path: results.sarif
          if-no-files-found: ignore
