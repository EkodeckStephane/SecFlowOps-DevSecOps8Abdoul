name: SecFlowOps build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install artifact requirements
        run: python -m pip install -r SecFlowOps/artifact/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s SecFlowOps/repos/sample_api/tests

      - name: Save timing marker
        if: always()
        run: |
          mkdir -p secflowops-ci-artifacts
          date -u +"%Y-%m-%dT%H:%M:%SZ" > secflowops-ci-artifacts/build-test-finished.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-artifacts
          path: secflowops-ci-artifacts/
