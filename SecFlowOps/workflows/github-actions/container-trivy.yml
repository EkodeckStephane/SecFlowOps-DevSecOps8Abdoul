name: SecFlowOps Trivy filesystem and container checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: SecFlowOps/repos/sample_api
          scanners: vuln,secret,misconfig
          format: json
          output: trivy_fs.json
          exit-code: "0"

      - name: Upload Trivy JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json
          path: trivy_fs.json
