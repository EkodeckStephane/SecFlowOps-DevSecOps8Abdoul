name: SecFlowOps remote CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, ist-q1-revision ]

permissions:
  contents: read

jobs:
  validate-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python requirements
        run: python -m pip install -r SecFlowOps/artifact/requirements.txt

      - name: Compile SecFlowOps Python modules
        run: python -m compileall SecFlowOps/scripts SecFlowOps/secflowops

      - name: Run sample API tests
        env:
          PYTHONPATH: SecFlowOps/repos/sample_api
        run: python -m unittest discover -s SecFlowOps/repos/sample_api/tests

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Test Rego policies
        run: opa test SecFlowOps/policies/rego

      - name: Verify workflow YAML syntax
        env:
          PYTHONPATH: SecFlowOps
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path(".github/workflows").glob("*.yml"))
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"validated {len(files)} workflow files")
          PY

      - name: Reanalyze final IST protocol
        run: python SecFlowOps/scripts/reanalyze_ist_protocol.py

      - name: Upload CI and IST reanalysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secflowops-ist-q1-evidence
          path: |
            SecFlowOps/tables/ist_retained_execution_manifest.csv
            SecFlowOps/tables/ist_workload_level_metrics.csv
            SecFlowOps/tables/ist_descriptive_summary.csv
            SecFlowOps/tables/ist_paired_effects.csv
            SecFlowOps/tables/ist_paired_release_decisions.csv
            SecFlowOps/tables/summary_metrics_full_protocol.csv
            SecFlowOps/tables/performance_by_config_full_protocol.csv
            SecFlowOps/experiments/full_protocol_study_report.md
            SecFlowOps/experiments/zap_dast_study_report.md
          if-no-files-found: error
