name: SecFlowOps remediation PR

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-remediation-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python requirements
        run: python -m pip install -r SecFlowOps/artifact/requirements.txt

      - name: Run deterministic remediation agent
        env:
          PYTHONPATH: SecFlowOps
        run: |
          python SecFlowOps/secflowops/agents/remediator_agent.py \
            --workspace SecFlowOps/repos/sample_api \
            --findings SecFlowOps/data/normalized/remediation_pr_probe.jsonl \
            --output secflowops-remediation-log.json

      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: secflowops-remediation-pr-evidence
          path: secflowops-remediation-log.json
          if-no-files-found: error

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: secflowops/remediation-pr-${{ github.run_id }}
          title: "SecFlowOps controlled remediation"
          commit-message: "Apply SecFlowOps controlled remediation"
          body: |
            Automated SecFlowOps remediation proposal generated by the remote GitHub Actions workflow.

            Scope:
            - escapes reflected HTML output in the controlled sample API;
            - parameterizes the controlled SQL lookup;
            - records the remediation log as workflow evidence.

            Human review is required before merge.
          labels: security,needs-review
          delete-branch: true
